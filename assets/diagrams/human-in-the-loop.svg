<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">Human confirmation</title>
  <desc id="desc">Cancelling ORD-1045 checks eligibility, interrupts the graph, and writes only if the user confirms.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="580" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="580" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>
    <rect x="40" y="32" width="280" height="96" rx="16" fill="#10213b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="70" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">CUSTOMER</text>
    <text x="180" y="100" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Cancel ORD-1045</text>
    <line x1="320" y1="80" x2="360" y2="80" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="364" y="32" width="330" height="96" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="529" y="70" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">SUPERVISOR</text>
    <text x="529" y="100" text-anchor="middle" fill="#f8fafc" font-size="18">orders, cancel_order</text>
    <line x1="694" y1="80" x2="734" y2="80" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="738" y="32" width="662" height="96" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1069" y="68" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">ELIGIBILITY, READ</text>
    <text x="1069" y="100" text-anchor="middle" fill="#f8fafc" font-size="18">In transit, owned by this customer</text>
    <line x1="1069" y1="128" x2="1069" y2="164" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="320" y="168" width="800" height="128" rx="18" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="720" y="208" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">GRAPH INTERRUPT</text>
    <text x="720" y="246" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Please confirm cancellation</text>
    <text x="720" y="276" text-anchor="middle" fill="#94a3b8" font-size="16">Pending action, five minutes, no write yet</text>
    <line x1="520" y1="296" x2="280" y2="368" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="920" y1="296" x2="1160" y2="368" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="300" y="340" fill="#fb7185" font-size="16" font-weight="700">Reject, expire, or mismatch</text>
    <text x="1000" y="340" fill="#34d399" font-size="16" font-weight="700">Confirm</text>
    <rect x="40" y="376" width="480" height="164" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="280" y="430" text-anchor="middle" fill="#fda4af" font-size="22" font-weight="700">Stop</text>
    <text x="280" y="464" text-anchor="middle" fill="#f8fafc" font-size="16">The pending action is cleared.</text>
    <text x="280" y="492" text-anchor="middle" fill="#94a3b8" font-size="16">The order stays in transit.</text>
    <rect x="920" y="376" width="480" height="164" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1160" y="430" text-anchor="middle" fill="#6ee7b7" font-size="22" font-weight="700">cancel_order</text>
    <text x="1160" y="464" text-anchor="middle" fill="#f8fafc" font-size="16">Same user, same action ID.</text>
    <text x="1160" y="492" text-anchor="middle" fill="#94a3b8" font-size="16">Order ORD-1045 is cancelled.</text>
  </g>
</svg>
