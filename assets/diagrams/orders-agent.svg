<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Orders agent workflow</title>
  <desc id="desc">START checks missing fields. Yes asks and ends. No prepares a tool. No tool or a read ends immediately. A write checks eligibility, then approval either executes the cancel or rejects it.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="0.75" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="860" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="860" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <rect x="600" y="24" width="200" height="44" rx="22" fill="#10213b" stroke="#7dd3fc" stroke-width="2"/>
    <text x="700" y="52" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">START</text>
    <line x1="700" y1="68" x2="700" y2="96" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="36" y="108" width="250" height="84" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="161" y="142" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">missingFields</text>
    <text x="161" y="168" text-anchor="middle" fill="#fcd34d" font-size="15">Ask, then stop</text>
    <line x1="161" y1="192" x2="161" y2="220" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="81" y="224" width="160" height="40" rx="20" fill="#10213b" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="161" y="250" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <rect x="470" y="108" width="360" height="84" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="650" y="142" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Missing fields?</text>
    <text x="650" y="168" text-anchor="middle" fill="#c4b5fd" font-size="15">Usually the order ID</text>
    <line x1="470" y1="150" x2="302" y2="150" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="348" y="134" width="58" height="28" rx="14" fill="#10213b"/>
    <text x="377" y="153" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">yes</text>

    <line x1="650" y1="192" x2="650" y2="236" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="666" y="202" width="50" height="28" rx="14" fill="#10213b"/>
    <text x="691" y="221" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">no</text>

    <rect x="470" y="244" width="360" height="84" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="650" y="278" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">prepareTool</text>
    <text x="650" y="304" text-anchor="middle" fill="#94a3b8" font-size="15">Validate the tool and arguments</text>

    <line x1="830" y1="286" x2="948" y2="286" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="848" y="270" width="68" height="28" rx="14" fill="#10213b"/>
    <text x="882" y="289" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">write</text>

    <rect x="952" y="244" width="452" height="84" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="1178" y="278" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">prepareConfirmation</text>
    <text x="1178" y="304" text-anchor="middle" fill="#7dd3fc" font-size="15">Eligibility is still a read</text>

    <path d="M520 328 V360 H161 V392" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M650 328 V392" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="286" y="346" width="86" height="28" rx="14" fill="#10213b"/>
    <text x="329" y="365" text-anchor="middle" fill="#fb7185" font-size="15" font-weight="700">no tool</text>
    <rect x="666" y="346" width="56" height="28" rx="14" fill="#10213b"/>
    <text x="694" y="365" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">read</text>

    <rect x="36" y="396" width="250" height="76" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="161" y="428" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">No tool</text>
    <text x="161" y="452" text-anchor="middle" fill="#fda4af" font-size="15">Stop</text>
    <line x1="161" y1="472" x2="161" y2="508" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="81" y="512" width="160" height="40" rx="20" fill="#10213b" stroke="#fb7185" stroke-width="1.5"/>
    <text x="161" y="538" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <rect x="470" y="396" width="360" height="76" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="650" y="428" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">executeReadTool</text>
    <text x="650" y="452" text-anchor="middle" fill="#6ee7b7" font-size="15">Status, estimate, or list</text>
    <line x1="650" y1="472" x2="650" y2="508" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="570" y="512" width="160" height="40" rx="20" fill="#10213b" stroke="#34d399" stroke-width="1.5"/>
    <text x="650" y="538" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <path d="M1060 328 V392" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1280 328 V360 H1404" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <rect x="900" y="348" width="120" height="28" rx="14" fill="#10213b"/>
    <text x="960" y="367" text-anchor="middle" fill="#fb7185" font-size="15" font-weight="700">not eligible</text>

    <rect x="930" y="396" width="260" height="76" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="1060" y="428" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Not eligible</text>
    <text x="1060" y="452" text-anchor="middle" fill="#fda4af" font-size="15">No approval card</text>
    <line x1="1060" y1="472" x2="1060" y2="508" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="980" y="512" width="160" height="40" rx="20" fill="#10213b" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1060" y="538" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <rect x="1216" y="396" width="188" height="76" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="1310" y="440" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">approval</text>
    <rect x="1210" y="346" width="200" height="28" rx="14" fill="#10213b"/>
    <text x="1310" y="365" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">confirmation required</text>

    <path d="M1260 472 V560 H1120 V596" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1360 472 V596" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1148" y="528" width="88" height="28" rx="14" fill="#10213b"/>
    <text x="1192" y="547" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">confirm</text>
    <text x="1360" y="520" text-anchor="middle" fill="#fb7185" font-size="14" font-weight="700">reject, expired,</text>
    <text x="1360" y="540" text-anchor="middle" fill="#fb7185" font-size="14" font-weight="700">mismatch, invalid</text>

    <rect x="980" y="600" width="280" height="76" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1120" y="632" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">executeWriteTool</text>
    <text x="1120" y="656" text-anchor="middle" fill="#6ee7b7" font-size="15">Idempotent cancel</text>
    <line x1="1120" y1="676" x2="1120" y2="712" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1040" y="716" width="160" height="40" rx="20" fill="#10213b" stroke="#34d399" stroke-width="1.5"/>
    <text x="1120" y="742" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <rect x="1280" y="600" width="124" height="76" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="1342" y="632" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">reject</text>
    <text x="1342" y="656" text-anchor="middle" fill="#fda4af" font-size="15">No write</text>
    <line x1="1342" y1="676" x2="1342" y2="712" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1262" y="716" width="160" height="40" rx="20" fill="#10213b" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1342" y="742" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">END</text>

    <text x="720" y="820" text-anchor="middle" fill="#94a3b8" font-size="16">A read finishes immediately. A write can finish only after approval.</text>
  </g>
</svg>
