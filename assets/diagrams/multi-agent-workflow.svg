<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent workflow</title>
  <desc id="desc">Every message starts at the supervisor and ends in exactly one of conversation, orders, policy, or guardrail.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="580" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="580" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>
    <rect x="540" y="28" width="360" height="52" rx="26" fill="#10213b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="720" y="61" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">User message</text>
    <line x1="720" y1="80" x2="720" y2="108" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="440" y="112" width="560" height="92" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="720" y="148" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">SUPERVISOR</text>
    <text x="720" y="178" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Route only. Do not answer.</text>
    <path d="M720 204 V240 H180 V276" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M720 204 V240 H540 V276" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M720 204 V240 H900 V276" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M720 204 V240 H1260 V276" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="40" y="280" width="280" height="148" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <text x="180" y="322" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">CONVERSATION</text>
    <text x="180" y="356" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Direct reply</text>
    <text x="180" y="386" text-anchor="middle" fill="#94a3b8" font-size="15">Greetings and general help</text>
    <rect x="360" y="280" width="360" height="148" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="540" y="322" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">ORDERS</text>
    <text x="540" y="356" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">MCP tools</text>
    <text x="540" y="386" text-anchor="middle" fill="#94a3b8" font-size="15">Status, delivery, list, cancel</text>
    <rect x="760" y="280" width="280" height="148" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="900" y="322" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">POLICY</text>
    <text x="900" y="356" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">RAG answer</text>
    <text x="900" y="386" text-anchor="middle" fill="#94a3b8" font-size="15">Customer or employee docs</text>
    <rect x="1080" y="280" width="320" height="148" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="1240" y="322" text-anchor="middle" fill="#fda4af" font-size="14" font-weight="700">GUARDRAIL</text>
    <text x="1240" y="356" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Refuse</text>
    <text x="1240" y="386" text-anchor="middle" fill="#94a3b8" font-size="15">Out of scope or unauthorized</text>
    <path d="M180 428 V472 H720" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M540 428 V472 H720" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M900 428 V472 H720" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M1240 428 V472 H720" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <line x1="720" y1="472" x2="720" y2="500" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="540" y="504" width="360" height="48" rx="24" fill="#10213b" stroke="#7dd3fc"/>
    <text x="720" y="534" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">One reply, then stop</text>
  </g>
</svg>
