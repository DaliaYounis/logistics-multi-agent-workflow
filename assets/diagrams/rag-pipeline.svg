<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">RAG pipeline</title>
  <desc id="desc">An admin indexes a customer or employee policy PDF. The policy agent later retrieves with a metadata filter.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="540" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="540" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>
    <text x="48" y="48" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="1.1">INDEX ONCE</text>
    <rect x="40" y="68" width="210" height="128" rx="16" fill="#10213b" stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="140" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Admin upload</text>
    <line x1="250" y1="132" x2="286" y2="132" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="290" y="68" width="210" height="128" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="395" y="118" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Chunk</text>
    <text x="395" y="148" text-anchor="middle" fill="#94a3b8" font-size="15">Pages into passages</text>
    <line x1="500" y1="132" x2="536" y2="132" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="540" y="68" width="210" height="128" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="645" y="118" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Embed</text>
    <text x="645" y="148" text-anchor="middle" fill="#94a3b8" font-size="15">OpenAI embeddings</text>
    <line x1="750" y1="132" x2="786" y2="132" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="790" y="68" width="610" height="128" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="1095" y="114" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Pinecone</text>
    <text x="1095" y="146" text-anchor="middle" fill="#67e8f9" font-size="16">customer_policy or employee_policy</text>
    <text x="48" y="244" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="1.1">ANSWER EACH QUESTION</text>
    <rect x="40" y="264" width="250" height="220" rx="16" fill="#10213b" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="348" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Policy question</text>
    <text x="165" y="380" text-anchor="middle" fill="#94a3b8" font-size="16">Role is already known</text>
    <line x1="290" y1="374" x2="326" y2="374" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="330" y="264" width="310" height="220" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="485" y="340" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Allow this corpus?</text>
    <text x="485" y="374" text-anchor="middle" fill="#94a3b8" font-size="16">Customers cannot open</text>
    <text x="485" y="400" text-anchor="middle" fill="#94a3b8" font-size="16">employee policy</text>
    <line x1="640" y1="374" x2="676" y2="374" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="680" y="264" width="280" height="220" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="820" y="348" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Retrieve</text>
    <text x="820" y="380" text-anchor="middle" fill="#67e8f9" font-size="16">metadata filter</text>
    <line x1="960" y1="374" x2="996" y2="374" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1000" y="264" width="400" height="220" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1200" y="340" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Answer</text>
    <text x="1200" y="374" text-anchor="middle" fill="#94a3b8" font-size="16">Streamed text</text>
    <text x="1200" y="400" text-anchor="middle" fill="#94a3b8" font-size="16">plus sources</text>
  </g>
</svg>
