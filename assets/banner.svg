<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Logistics Multi-Agent AI System</title>
  <desc id="desc">The client sends each message to a LangGraph supervisor. The supervisor chooses exactly one route: Conversation, Orders, Policy, or Guardrail.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card">
      <rect width="1440" height="520" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="520" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <text x="56" y="118" fill="#f8fafc" font-size="48" font-weight="700">Logistics Multi-Agent</text>
    <text x="56" y="174" fill="#f8fafc" font-size="48" font-weight="700">AI System</text>
    <text x="56" y="226" fill="#94a3b8" font-size="18">Production-style support orchestration with LangGraph,</text>
    <text x="56" y="252" fill="#94a3b8" font-size="18">RAG, MCP, human approval, streaming, and observability.</text>

    <rect x="56" y="286" width="168" height="42" rx="21" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="140" y="313" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">LANGGRAPH</text>
    <rect x="236" y="286" width="184" height="42" rx="21" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="328" y="313" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">MULTI-AGENT</text>
    <rect x="432" y="286" width="96" height="42" rx="21" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="480" y="313" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">RAG</text>

    <rect x="56" y="342" width="96" height="42" rx="21" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="104" y="369" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">MCP</text>
    <rect x="164" y="342" width="88" height="42" rx="21" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="208" y="369" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">SSE</text>
    <rect x="264" y="342" width="172" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="350" y="369" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">LANGSMITH</text>

    <text x="56" y="440" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="1.6">AI ENGINEER CASE STUDY</text>

    <rect x="900" y="40" width="280" height="74" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="1040" y="70" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Client</text>
    <text x="1040" y="94" text-anchor="middle" fill="#94a3b8" font-size="15">React and chat</text>
    <line x1="1040" y1="114" x2="1040" y2="142" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="870" y="146" width="340" height="90" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="1040" y="182" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Supervisor</text>
    <text x="1040" y="210" text-anchor="middle" fill="#c4b5fd" font-size="15">Chooses exactly one agent</text>

    <line x1="1040" y1="236" x2="1040" y2="266" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="754" y1="266" x2="1326" y2="266" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="754" y1="266" x2="754" y2="294" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="944" y1="266" x2="944" y2="294" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1134" y1="266" x2="1134" y2="294" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1326" y1="266" x2="1326" y2="294" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="666" y="298" width="176" height="124" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <text x="754" y="338" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Conversation</text>
    <text x="754" y="364" text-anchor="middle" fill="#93c5fd" font-size="14">Direct reply</text>
    <text x="754" y="388" text-anchor="middle" fill="#64748b" font-size="13">No tools</text>

    <rect x="856" y="298" width="176" height="124" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="944" y="338" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Orders</text>
    <text x="944" y="364" text-anchor="middle" fill="#6ee7b7" font-size="14">MCP tools</text>
    <text x="944" y="388" text-anchor="middle" fill="#64748b" font-size="13">Confirm to cancel</text>

    <rect x="1046" y="298" width="176" height="124" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="1134" y="338" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Policy</text>
    <text x="1134" y="364" text-anchor="middle" fill="#67e8f9" font-size="14">RAG by role</text>
    <text x="1134" y="388" text-anchor="middle" fill="#64748b" font-size="13">Cited documents</text>

    <rect x="1238" y="298" width="176" height="124" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="1326" y="338" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Guardrail</text>
    <text x="1326" y="364" text-anchor="middle" fill="#fda4af" font-size="14">Refuse</text>
    <text x="1326" y="388" text-anchor="middle" fill="#64748b" font-size="13">Stops the request</text>

    <text x="1040" y="468" text-anchor="middle" fill="#94a3b8" font-size="16">One message, one route. These agents do not call each other.</text>
  </g>
</svg>
