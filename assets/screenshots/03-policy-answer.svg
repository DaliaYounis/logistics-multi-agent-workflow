<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Policy answer with sources</title>
  <desc id="desc">A cancellation policy answer cites a knowledge-base document instead of calling an order tool.</desc>
  <rect width="960" height="560" fill="#f5f7fa"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect width="960" height="58" fill="#ffffff"/>
    <line x1="0" y1="58" x2="960" y2="58" stroke="#e4e7ec"/>
    <rect x="28" y="12" width="34" height="34" rx="10" fill="#10213b"/>
    <text x="45" y="34" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LF</text>
    <text x="72" y="27" fill="#10213b" font-size="15" font-weight="700">LogiFlow</text>
    <text x="72" y="43" fill="#667085" font-size="11">AI Logistics Support</text>
    <rect x="690" y="14" width="118" height="30" rx="8" fill="#eaf3ff"/>
    <text x="749" y="34" text-anchor="middle" fill="#1769e0" font-size="12" font-weight="700">Support Chat</text>
    <text x="860" y="34" text-anchor="middle" fill="#667085" font-size="12" font-weight="650">Knowledge</text>

    <rect x="48" y="82" width="864" height="450" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="48" y="82" width="864" height="64" rx="18" fill="#10213b"/>
    <rect x="48" y="120" width="864" height="26" fill="#10213b"/>
    <text x="78" y="118" fill="#ffffff" font-size="16" font-weight="700">LogiFlow Assistant</text>
    <text x="78" y="138" fill="#d0d5dd" font-size="12">Online · Logistics support</text>

    <rect x="500" y="172" width="380" height="44" rx="14" fill="#1769e0"/>
    <text x="522" y="199" fill="#ffffff" font-size="14">What is the cancellation policy?</text>

    <rect x="72" y="236" width="36" height="36" rx="10" fill="#10213b"/>
    <text x="90" y="259" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">LF</text>
    <rect x="120" y="236" width="620" height="168" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="138" y="252" width="132" height="18" rx="4" fill="#e7f7f8"/>
    <text x="204" y="265" text-anchor="middle" fill="#0e7490" font-size="10" font-weight="700">CUSTOMER POLICY</text>
    <text x="138" y="294" fill="#344054" font-size="14">In-transit orders can be cancelled before delivery.</text>
    <text x="138" y="316" fill="#344054" font-size="14">Delivered orders are no longer eligible for cancellation.</text>
    <line x1="138" y1="336" x2="710" y2="336" stroke="#f2f4f7"/>
    <text x="138" y="358" fill="#10213b" font-size="12" font-weight="700">Knowledge sources</text>
    <circle cx="146" cy="378" r="4" fill="#2ab6c8"/>
    <text x="158" y="382" fill="#344054" font-size="12">customer-cancellation-policy.pdf</text>

    <rect x="72" y="470" width="816" height="42" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="90" y="496" fill="#98a2b3" font-size="13">Ask about an order, delivery, cancellation, or policy...</text>
  </g>
</svg>
