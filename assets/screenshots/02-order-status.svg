    <rect x="138" y="260" width="108" height="18" rx="4" fill="#eaf3ff"/>
    <text x="192" y="273" text-anchor="middle" fill="#1769e0" font-size="10" font-weight="700">ORDER STATUS</text>
    <text x="138" y="306" fill="#344054" font-size="15">Order ORD-1045 is currently in transit.</text>

    <rect x="72" y="470" width="816" height="42" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="90" y="496" fill="#98a2b3" font-size="13">Ask about an order, delivery, cancellation, or policy...</text>
    <rect x="840" y="476" width="36" height="30" rx="8" fill="#d0d5dd"/>
