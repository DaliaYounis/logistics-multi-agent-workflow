<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Order status reply</title>
  <desc id="desc">The assistant reports that order ORD-1045 is in transit after an order status request.</desc>
  <rect width="960" height="560" fill="#f5f7fa"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect width="960" height="58" fill="#ffffff"/>
    <line x1="0" y1="58" x2="960" y2="58" stroke="#e4e7ec"/>
    <rect x="28" y="12" width="34" height="34" rx="10" fill="#10213b"/>
    <text x="45" y="34" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LF</text>
    <text x="72" y="27" fill="#10213b" font-size="15" font-weight="700">LogiFlow</text>
    <text x="72" y="43" fill="#667085" font-size="11">AI Logistics Support</text>
    <rect x="690" y="14" width="118" height="30" rx="8" fill="#eaf3ff"/>
    <text x="749" y="34" text-anchor="middle" fill="#1769e0" font-size="12" font-weight="700">Support Chat</text>
    <text x="860" y="34" text-anchor="middle" fill="#667085" font-size="12" font-weight="650">Knowledge</text>

    <rect x="48" y="82" width="864" height="450" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="48" y="82" width="864" height="64" rx="18" fill="#10213b"/>
    <rect x="48" y="120" width="864" height="26" fill="#10213b"/>
    <text x="78" y="118" fill="#ffffff" font-size="16" font-weight="700">LogiFlow Assistant</text>
    <text x="78" y="138" fill="#d0d5dd" font-size="12">Online · Logistics support</text>
    <text x="760" y="128" text-anchor="middle" fill="#d0d5dd" font-size="12">Human approval for actions</text>

    <rect x="430" y="176" width="450" height="44" rx="14" fill="#1769e0"/>
    <text x="452" y="203" fill="#ffffff" font-size="14">What is the current status of my order ORD-1045?</text>

    <rect x="72" y="244" width="36" height="36" rx="10" fill="#10213b"/>
    <text x="90" y="267" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">LF</text>
