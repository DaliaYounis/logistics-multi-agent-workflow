<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Cancellation approval card</title>
  <desc id="desc">The assistant asks the customer to confirm cancellation of ORD-1045 before any write runs.</desc>
  <rect width="960" height="560" fill="#f5f7fa"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect width="960" height="58" fill="#ffffff"/>
    <line x1="0" y1="58" x2="960" y2="58" stroke="#e4e7ec"/>
    <rect x="28" y="12" width="34" height="34" rx="10" fill="#10213b"/>
    <text x="45" y="34" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">LF</text>
    <text x="72" y="27" fill="#10213b" font-size="15" font-weight="700">LogiFlow</text>
    <text x="72" y="43" fill="#667085" font-size="11">AI Logistics Support</text>
    <rect x="690" y="14" width="118" height="30" rx="8" fill="#eaf3ff"/>
    <text x="749" y="34" text-anchor="middle" fill="#1769e0" font-size="12" font-weight="700">Support Chat</text>
    <text x="860" y="34" text-anchor="middle" fill="#667085" font-size="12" font-weight="650">Knowledge</text>

    <rect x="48" y="78" width="864" height="458" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="48" y="78" width="864" height="58" rx="18" fill="#10213b"/>
    <rect x="48" y="112" width="864" height="24" fill="#10213b"/>
    <text x="78" y="114" fill="#ffffff" font-size="16" font-weight="700">LogiFlow Assistant</text>
    <text x="760" y="114" text-anchor="middle" fill="#f7d8aa" font-size="12">Action waiting for approval</text>

    <rect x="520" y="156" width="360" height="40" rx="14" fill="#1769e0"/>
    <text x="540" y="181" fill="#ffffff" font-size="14">Can I cancel order ORD-1045?</text>

    <rect x="72" y="214" width="36" height="36" rx="10" fill="#10213b"/>
    <text x="90" y="237" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">LF</text>
    <rect x="120" y="214" width="470" height="210" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <rect x="138" y="230" width="112" height="18" rx="4" fill="#fff3e6"/>
    <text x="194" y="243" text-anchor="middle" fill="#794206" font-size="10" font-weight="700">CANCEL ORDER</text>
    <text x="138" y="272" fill="#344054" font-size="14">Please confirm that you want to cancel order ORD-1045.</text>

    <rect x="138" y="290" width="434" height="116" rx="12" fill="#fffaf2" stroke="#f7d8aa"/>
    <text x="156" y="316" fill="#794206" font-size="13" font-weight="700">Approval required</text>
    <text x="156" y="334" fill="#a06b2d" font-size="12">Please confirm before this action is executed.</text>
    <rect x="156" y="348" width="398" height="24" rx="6" fill="#ffffff"/>
    <text x="168" y="364" fill="#8a5a20" font-size="12">Order</text>
    <text x="536" y="364" text-anchor="end" fill="#794206" font-size="12" font-weight="700">ORD-1045</text>
    <rect x="156" y="380" width="150" height="28" rx="8" fill="#178a5a"/>
    <text x="231" y="398" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Confirm action</text>
    <rect x="316" y="380" width="90" height="28" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="361" y="398" text-anchor="middle" fill="#344054" font-size="12" font-weight="700">Reject</text>

    <rect x="72" y="470" width="816" height="42" rx="12" fill="#f8fafc" stroke="#e4e7ec"/>
    <text x="90" y="496" fill="#98a2b3" font-size="13">Confirm or reject the pending action first</text>
  </g>
</svg>
